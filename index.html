 "dang-taxi":{stats:[["약 40분","평일 낮 기준"],["28km","거리"],["약 3만 원","요금+통행료"]],
  legs:[{mode:"car",path:DTAXI}],
  steps:[["🚕","당정역 출발","군포시 당정동","0분",0],["🛣️","동군포IC → 영동고속도로","강릉 방향 약 13km","5분",0.08],["🔀","신갈JC → 경부고속도로","부산 방향 약 7km","20분",0.55],["🚕","기흥동탄IC 진출","동탄대로","30분",0.8],["🛍️","롯데백화점 동탄점 도착","동탄역로 160","40분",1]],
  note:"출퇴근 시간(07–09시, 18–20시)에는 신갈JC 부근이 막혀 1시간 넘게 걸릴 수 있어요. 요금은 대략치예요.",
  kmap:"https://map.kakao.com/?sName=%EB%8B%B9%EC%A0%95%EC%97%AD&eName=%EB%A1%AF%EB%8D%B0%EB%B0%B1%ED%99%94%EC%A0%90%20%EB%8F%99%ED%83%84%EC%A0%90"}
};
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const STY={car:{c:"--car",d:null,i:"🚕"},rail:{c:"--rail",d:null,i:"🚇"},bus:{c:"--bus",d:null,i:"🚌"},walk:{c:"--walk",d:"2 8",i:"🚶"}};
const map=L.map("map",{zoomControl:false}).setView([37.27,127.02],11);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);
const icon=t=>L.divIcon({html:`<div style="font-size:22px">${t}</div>`,className:"",iconSize:[24,24],iconAnchor:[12,12]});
L.marker(LOTTE,{icon:icon("🛍️")}).addTo(map).bindTooltip("롯데백화점 동탄점");
let layer=L.layerGroup().addTo(map),mover=null,raf=0,o="ilsan",m="pt",cur="ilsan-pt";
const dist=(a,b)=>Math.hypot(a[0]-b[0],(a[1]-b[1])*0.8);
function flat(r){const pts=[];r.legs.forEach(l=>l.path.forEach(p=>pts.push({p,m:l.mode})));return pts}
function at(pts,f){let tot=0;const seg=[];for(let i=1;i<pts.length;i++){const d=dist(pts[i-1].p,pts[i].p);seg.push(d);tot+=d}
 let t=f*tot;for(let i=0;i<seg.length;i++){if(t<=seg[i]){const k=seg[i]?t/seg[i]:0,a=pts[i].p,b=pts[i+1].p;return{ll:[a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k],m:pts[i+1].m}}t-=seg[i]}return{ll:pts[pts.length-1].p,m:pts[pts.length-1].m}}
function show(){cur=o+"-"+m;const r=ROUTES[cur];document.querySelectorAll("#otabs button").forEach(b=>b.classList.toggle("on",b.dataset.o===o));document.querySelectorAll("#mtabs button").forEach(b=>b.classList.toggle("on",b.dataset.m===m));
 document.getElementById("stats").innerHTML=r.stats.map(s=>`<div class="stat"><b>${s[0]}</b><span>${s[1]}</span></div>`).join("");
 document.getElementById("steps").innerHTML=r.steps.map(s=>`<div class="step" data-f="${s[4]}"><div class="ic">${s[0]}</div><div><h3>${s[1]}</h3><p>${s[2]}</p></div><div class="t">${s[3]}</div></div>`).join("");
 document.getElementById("note").textContent=r.note;document.getElementById("kmap").href=r.kmap;
 layer.clearLayers();L.marker(ORIG[o].ll,{icon:icon("🟢")}).addTo(layer).bindTooltip(ORIG[o].name);r.legs.forEach(l=>{const s=STY[l.mode];L.polyline(l.path,{color:css(s.c),weight:5,opacity:.25,dashArray:s.d}).addTo(layer)});
 map.fitBounds(L.latLngBounds(r.legs.flatMap(l=>l.path)),{padding:[30,30]});
 document.querySelectorAll(".step").forEach(el=>el.onclick=()=>{const p=at(flat(r),+el.dataset.f).ll;map.setView(p,14);window.scrollTo({top:0,behavior:"smooth"})});
 play()}
function play(){cancelAnimationFrame(raf);const r=ROUTES[cur],pts=flat(r);const trail=L.polyline([],{weight:5}).addTo(layer);
 if(mover)mover.remove();mover=L.marker(pts[0].p,{icon:icon(STY[pts[0].m].i),zIndexOffset:1000}).addTo(map);
 const T=6000,t0=performance.now();let lastM=null,done=[],tr=trail;
 (function step(now){const f=Math.min(1,(now-t0)/T),q=at(pts,f);if(q.m!==lastM){lastM=q.m;mover.setIcon(icon(STY[q.m].i));done=done.slice(-1);tr=L.polyline([],{weight:5,color:css(STY[q.m].c),dashArray:STY[q.m].d}).addTo(layer)}
  done.push(q.ll);tr.setLatLngs(done);
  mover.setLatLng(q.ll);if(f<1)raf=requestAnimationFrame(step)})(t0)}
document.querySelectorAll("#otabs button").forEach(b=>b.onclick=()=>{o=b.dataset.o;show()});document.querySelectorAll("#mtabs button").forEach(b=>b.onclick=()=>{m=b.dataset.m;show()});document.getElementById("replay").onclick=show;
show();
</script></body></html>
