header{padding:16px 16px 8px}h1{font-size:20px;margin:0}header p{margin:2px 0 0;color:var(--sub);font-size:13px}

.07769],[37.22223,127.0771],[37.22211,127.07693],[37.22193,127.0767],[37.22176,127.07638],[37.2216,127.07583],[37.22158,127.07575],[37.22157,127.07564],[37.22157,127.07559],[37.22156,127.0755],[37.22138,127.07561]],"bus":[[37.22138,127.07561],[37.22084,127.07595],[37.22072,127.07604],[37.2204,127.07619],[37.21962,127.07654],[37.21925,127.07672],[37.21865,127.07701],[37.2184,127.07714],[37.21824,127.07722],[37.21796,127.07736],[37.21763,127.07756],[37.21753,127.07761],[37.21712,127.07777],[37.21704,127.07781],[37.21694,127.07784],[37.21677,127.07789],[37.21648,127.07797],[37.21625,127.07805],[37.21501,127.07842],[37.21492,127.0785],[37.21482,127.07852],[37.21452,127.07861],[37.21442,127.07864],[37.21428,127.07868],[37.2141,127.07873],[37.21394,127.07878],[37.21376,127.07885],[37.21365,127.07889],[37.21158,127.07973],[37.21148,127.07977],[37.21147,127.07978],[37.21127,127.07968],[37.21116,127.07923],[37.21104,127.07879],[37.21101,127.07869],[37.21095,127.07851],[37.21086,127.07825],[37.21066,127.07767],[37.21048,127.07726],[37.21043,127.07715],[37.21009,127.07646],[37.20982,127.07597],[37.20961,127.07563],[37.20941,127.07531],[37.20904,127.07479],[37.20896,127.07469],[37.20891,127.07461],[37.20881,127.07448],[37.20857,127.0742],[37.20836,127.07395],[37.20814,127.07373],[37.208,127.07359]],"walk2":[[37.208,127.07359],[37.20789,127.07347],[37.20775,127.07334],[37.20739,127.07299],[37.20729,127.07291],[37.20697,127.07268],[37.20668,127.07247]]};

const ROUTES={

 bus:{stats:[["약 25분","대기 포함"],["버스 1번","환승 없음"],["1,500원대","교통카드"]],

const dist=(a,b)=>Math.hypot(a[0]-b[0],(a[1]-b[1])*0.8);
function at(p,f){let tot=0;const s=[];for(let i=1;i<p.length;i++){const d=dist(p[i-1],p[i]);s.push(d);tot+=d}let t=f*tot;for(let i=0;i<s.length;i++){if(t<=s[i]){const k=s[i]?t/s[i]:0;return[p[i][0]+(p[i+1][0]-p[i][0])*k,p[i][1]+(p[i+1][1]-p[i][1])*k]}t-=s[i]}return p[p.length-1]}

 function leg(){if(my!==run)return;const l=r.legs[li];say(l.msg);mover.setIcon(icon(STY[l.m].i,28));
  if(l.z)map.flyTo(at(l.p,.5),l.z,{duration:.8});else map.flyToBounds(L.latLngBounds(l.p),{padding:[40,40],duration:.6});

  setTimeout(()=>{const t0=performance.now();(function step(now){if(my!==run)return;const f=Math.min(1,(now-t0)/l.t),q=at(l.p,f);pts.push(q);tr.setLatLngs(pts);mover.setLatLng(q);
   if(f<1)raf=requestAnimationFrame(step);else{li++;if(li<r.legs.length)setTimeout(leg,350);else{say("🎉 창심관 도착!");mover.setIcon(icon("🙋",28))}}})(t0)},l.z?850:650)}
 leg()}
